name: Secure My Stack CI Pipeline
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  scan:
    name: Run Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Security Tools
        run: |
          pip install bandit checkov
          curl -sSL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          chmod +x gitleaks && sudo mv gitleaks /usr/local/bin/
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
      
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform
      
      - name: Terraform Format Check
        run: terraform fmt -check
        continue-on-error: true
        working-directory: ./terraform
      
      - name: Terraform Validate
        run: terraform validate
        continue-on-error: true
        working-directory: ./terraform
      
      - name: Run tfsec
        id: tfsec
        run: |
          tfsec ./terraform --format json --out tfsec-results.json || true
          tfsec ./terraform
        continue-on-error: true
      
      - name: Run checkov
        id: checkov
        run: |
          checkov -d ./terraform --output json --output-file-path . || true
          checkov -d ./terraform
        continue-on-error: true
      
      - name: Run Bandit
        id: bandit
        run: |
          bandit -r ./python-app -f json -o bandit-results.json -ll || true
          bandit -r ./python-app -ll
        continue-on-error: true
      
      - name: Run gitleaks
        id: gitleaks
        run: gitleaks detect --source=. --no-banner --exit-code 0 --report-format json --report-path gitleaks-results.json || true
        continue-on-error: true
      
      - name: Security Gate Decision
        if: always()
        run: |
          echo "=== Security Gate Evaluation ==="
          BLOCK_DEPLOYMENT=false
          
          # Check tfsec for CRITICAL/HIGH issues
          if [ -f tfsec-results.json ]; then
            CRITICAL_COUNT=$(cat tfsec-results.json | jq '[.results[]? | select(.severity=="CRITICAL")] | length' || echo "0")
            HIGH_COUNT=$(cat tfsec-results.json | jq '[.results[]? | select(.severity=="HIGH")] | length' || echo "0")
            echo "tfsec: Found $CRITICAL_COUNT CRITICAL and $HIGH_COUNT HIGH severity issues"
            if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
              echo "❌ tfsec: Blocking deployment due to CRITICAL/HIGH issues"
              BLOCK_DEPLOYMENT=true
            fi
          fi
          
          # Check Bandit for MEDIUM/HIGH issues only (ignore LOW)
          if [ -f bandit-results.json ]; then
            HIGH_BANDIT=$(cat bandit-results.json | jq '.metrics.SEVERITY_HIGH // 0')
            MEDIUM_BANDIT=$(cat bandit-results.json | jq '.metrics.SEVERITY_MEDIUM // 0')
            echo "Bandit: Found $HIGH_BANDIT HIGH and $MEDIUM_BANDIT MEDIUM severity issues"
            if [ "$HIGH_BANDIT" -gt 0 ] || [ "$MEDIUM_BANDIT" -gt 0 ]; then
              echo "❌ Bandit: Blocking deployment due to MEDIUM/HIGH issues"
              BLOCK_DEPLOYMENT=true
            else
              echo "⚠️ Bandit: LOW severity issues found but not blocking deployment"
            fi
          fi
          
          # Check for secrets (gitleaks) - ANY secret blocks deployment
          if [ -f gitleaks-results.json ]; then
            LEAKS_COUNT=$(cat gitleaks-results.json | jq '. | length' || echo "0")
            if [ "$LEAKS_COUNT" -gt 0 ]; then
              echo "❌ Gitleaks: Found $LEAKS_COUNT secrets - blocking deployment"
              BLOCK_DEPLOYMENT=true
            fi
          fi
          
          # Final decision
          if [ "$BLOCK_DEPLOYMENT" = true ]; then
            echo "🛑 DEPLOYMENT BLOCKED due to critical security issues"
            exit 1
          else
            echo "✅ Security gate passed (only low-severity issues found)"
            exit 0
          fi

  deploy:
    name: Deploy Infrastructure with Terraform
    runs-on: ubuntu-latest
    needs: scan  # CRITICAL FIX: Makes deployment dependent on successful security scans
    # Only deploy on push to develop, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Update with your preferred region
      
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform
      
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./terraform
      
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform
