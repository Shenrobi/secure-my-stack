name: Secure My Stack CI Pipeline
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  scan:
    name: Run Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Security Tools
        run: |
          pip install bandit checkov
          curl -sSL https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          chmod +x gitleaks && sudo mv gitleaks /usr/local/bin/
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
      
      - name: Format & Validate Terraform
        run: |
          terraform init
          terraform fmt -check
          terraform validate
      
      - name: Run tfsec
        run: tfsec ./terraform
      
      - name: Run checkov
        run: checkov -d ./terraform
      
      - name: Run Bandit
        run: bandit -r ./python-app
      
      - name: Run gitleaks
        run: gitleaks detect --source=. --no-banner

  deploy:
    name: Deploy Infrastructure with Terraform
    runs-on: ubuntu-latest
    needs: scan  # CRITICAL FIX: Makes deployment dependent on successful security scans
    # Only deploy on push to develop, not on pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Update with your preferred region
      
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform
      
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ./terraform
      
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform
